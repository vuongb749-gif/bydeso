<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mô hình 3D căn hộ | Bydeso</title>
<style>
  :root{--ink:#2a2412;--accent:#e0a800}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#efeeec;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink)}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
  #c:active{cursor:grabbing}
  .head{position:fixed;left:16px;top:14px;pointer-events:none;max-width:calc(100% - 80px)}
  .head b{display:block;font-size:17px}
  .head span{font-size:13px;color:#6b6456}
  .bar{position:fixed;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 12px;pointer-events:none}
  .row{display:flex;gap:6px;max-width:100%;overflow-x:auto;scrollbar-width:none;padding:2px;pointer-events:auto}
  .row::-webkit-scrollbar{display:none}
  .row button{flex:none;border:1px solid rgba(42,36,18,.16);background:rgba(255,255,255,.94);color:var(--ink);font:600 13px/1 inherit;font-family:inherit;padding:10px 13px;border-radius:999px;cursor:pointer;white-space:nowrap}
  .row button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
  .row button:focus-visible,.zoom button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .zoom{position:fixed;right:14px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px}
  .zoom button{width:42px;height:42px;border-radius:50%;border:1px solid rgba(42,36,18,.16);background:rgba(255,255,255,.94);font-size:22px;line-height:1;color:var(--ink);cursor:pointer}
  .hint{font-size:12px;color:#6b6456;text-align:center;background:rgba(255,255,255,.8);padding:5px 10px;border-radius:8px}
  .lab{position:fixed;left:0;top:0;transform:translate(-50%,-50%);background:rgba(42,36,18,.82);color:#fff;font-size:11.5px;font-weight:600;padding:4px 8px;border-radius:7px;white-space:nowrap;pointer-events:none;will-change:transform}
  body.nolab .lab{display:none}
  body.embed .head,body.embed #views,body.embed #tools{display:none}
  body.embed .bar{left:10px;right:auto;top:10px;bottom:auto;padding:0;align-items:flex-start}
  body.embed .hint{font-size:11.5px;padding:4px 8px;background:rgba(255,255,255,.88)}
  body.embed .zoom{top:10px;right:10px;transform:none;flex-direction:row}
  body.embed .zoom button{width:34px;height:34px;font-size:18px}
  #err{position:fixed;inset:0;display:none;place-items:center;text-align:center;padding:24px;font-size:15px}
  #load{position:fixed;inset:0;display:grid;place-items:center;font-size:14px;color:#6b6456;pointer-events:none}
  @media(max-width:560px){.hint{font-size:11px}.head b{font-size:15px}.lab{font-size:10.5px;padding:3px 6px}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<canvas id="c" aria-label="Mô hình 3D căn hộ"></canvas>
<div class="head"><b id="ttl"></b><span id="sub"></span></div>
<div class="zoom"><button type="button" id="zi" aria-label="Phóng to">+</button><button type="button" id="zo" aria-label="Thu nhỏ">−</button></div>
<div class="bar"><div class="hint" id="hint"></div><div class="row" id="views"></div><div class="row" id="tools"></div></div>
<div id="load"></div>
<div id="err"></div>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {RoundedBoxGeometry} from 'three/addons/geometries/RoundedBoxGeometry.js';

const Q=new URLSearchParams(location.search),EN=Q.get('lang')==='en',L=(v,e)=>EN?e:v,$=s=>document.querySelector(s);
const TOUCH=matchMedia('(pointer:coarse)').matches,EMBED=Q.has('embed');
if(EMBED)document.body.classList.add('embed');
$('#load').textContent=L('Đang dựng mô hình…','Building the model…');
$('#ttl').textContent=(Q.get('code')||'CH-xx11')+' · 3PN · '+L('88,7 m²','88.7 m²');
$('#sub').textContent=L('Mô hình minh họa theo layout Salekit, nội thất mang tính tương đối','Illustrative model from the sales kit layout; furnishing is indicative');
$('#hint').textContent=EMBED?L('Kéo để xoay 360°','Drag to rotate 360°'):TOUCH?L('Một ngón để xoay · Hai ngón để phóng to và di chuyển','One finger to rotate · Two fingers to zoom and move'):L('Kéo chuột để xoay · Cuộn để phóng to · Chuột phải để di chuyển','Drag to rotate · Scroll to zoom · Right-drag to move');

let renderer;
try{renderer=new THREE.WebGLRenderer({canvas:$('#c'),antialias:true,powerPreference:'high-performance'})}
catch(e){$('#load').style.display='none';const m=$('#err');m.style.display='grid';m.textContent=L('Thiết bị này chưa hiển thị được mô hình 3D. Bạn vui lòng xem ảnh layout trên trang căn hộ.','This device cannot show the 3D model. Please see the layout images on the unit page.');throw e}
renderer.setPixelRatio(Math.min(devicePixelRatio,TOUCH?1.6:2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.92;renderer.outputColorSpace=THREE.SRGBColorSpace;

const sc=new THREE.Scene();sc.background=new THREE.Color(0xefeeec);
sc.environment=new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(renderer),.04).texture;
const cam=new THREE.PerspectiveCamera(36,1,.1,200);
sc.add(new THREE.HemisphereLight(0xfff6ea,0xb8ab98,.4));
const sun=new THREE.DirectionalLight(0xfff0dc,1.7);sun.castShadow=true;sun.shadow.mapSize.set(TOUCH?1024:2048,TOUCH?1024:2048);
Object.assign(sun.shadow.camera,{left:-11,right:11,top:11,bottom:-11,near:1,far:50});sun.shadow.bias=-.0004;sun.shadow.normalBias=.02;
sun.position.set(-7,17,3);sun.target.position.set(3.8,0,7.1);sc.add(sun,sun.target);

// ---------- vật liệu vẽ bằng canvas ----------
let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const canvasTex=(w,h,draw,rw=true)=>{const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;if(rw)t.wrapS=t.wrapT=THREE.RepeatWrapping;return t};
const oakTex=()=>canvasTex(1024,1024,(g,w,h)=>{const n=8,pw=w/n;for(let i=0;i<n;i++){let y=-rnd()*h*.6;while(y<h){const l=h*(.45+rnd()*.3),v=rnd()*16-8;g.fillStyle=`rgb(${192+v},${158+v},${118+v})`;g.fillRect(i*pw,y,pw,l);
  for(let k=0;k<26;k++){g.fillStyle=`rgba(120,88,54,${.03+rnd()*.05})`;g.fillRect(i*pw+rnd()*pw,y,1+rnd()*1.5,l)}g.fillStyle='rgba(90,66,40,.3)';g.fillRect(i*pw,y+l-1,pw,2);y+=l}g.fillStyle='rgba(90,66,40,.3)';g.fillRect(i*pw,0,1.5,h)}});
const tileTex=(a,b)=>canvasTex(512,512,(g,w,h)=>{g.fillStyle=a;g.fillRect(0,0,w,h);for(let k=0;k<90;k++){g.strokeStyle=`rgba(120,110,95,${.02+rnd()*.05})`;g.lineWidth=1+rnd()*3;g.beginPath();const x=rnd()*w,y=rnd()*h;g.moveTo(x,y);g.bezierCurveTo(x+rnd()*90,y+rnd()*90,x-rnd()*90,y+rnd()*90,x+rnd()*120,y+rnd()*120);g.stroke()}g.strokeStyle=b;g.lineWidth=3;g.strokeRect(0,0,w,h)});
const marbleTex=(bg,vein)=>canvasTex(512,512,(g,w,h)=>{g.fillStyle=bg;g.fillRect(0,0,w,h);for(let k=0;k<22;k++){g.strokeStyle=vein;g.globalAlpha=.15+rnd()*.5;g.lineWidth=.6+rnd()*2.4;g.beginPath();let x=rnd()*w,y=rnd()*h;g.moveTo(x,y);for(let i=0;i<6;i++){x+=rnd()*90-30;y+=rnd()*70-35;g.lineTo(x,y)}g.stroke()}g.globalAlpha=1});
const rugTex=()=>canvasTex(768,512,(g,w,h)=>{g.fillStyle='#dcd8d2';g.fillRect(0,0,w,h);for(let i=0;i<9;i++){g.strokeStyle=i%2?'#4a4845':'#8b8782';g.lineWidth=14+rnd()*16;g.beginPath();for(let x=-20;x<=w+20;x+=20){const y=i*62+Math.sin(x/80+i*.6)*42;x<0?g.moveTo(x,y):g.lineTo(x,y)}g.stroke()}},false);
const S=(c,o)=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.75,envMapIntensity:.55},o||{}));
const oak=oakTex(),tile=tileTex('#d8d0c4','#b8ae9f'),tileB=tileTex('#e6e0d7','#c4bbad');
const M={wall:S(0xefe4e4,{roughness:.95}),cap:S(0xffffff,{roughness:.9}),oak:S(0xffffff,{map:oak,roughness:.55}),tile:S(0xffffff,{map:tile,roughness:.35}),balc:S(0xffffff,{map:tileB,roughness:.5}),clad:S(0xffffff,{map:tile,roughness:.3}),
  marble:S(0xffffff,{map:marbleTex('#efedea','#8d8880'),roughness:.2,envMapIntensity:1}),black:S(0xffffff,{map:marbleTex('#1d1b19','#b9a98f'),roughness:.15,envMapIntensity:1}),
  wood:S(0xc9a981,{roughness:.55}),door:S(0xb58f62,{roughness:.55}),cab:S(0xe4dfd6,{roughness:.5}),dark:S(0x26262a,{roughness:.4}),frame:S(0x34343a,{roughness:.35,metalness:.55}),steel:S(0xc4c7cb,{roughness:.25,metalness:.9}),
  white:S(0xfafaf8,{roughness:.2,envMapIntensity:1}),sofa:S(0xc6c1b8,{roughness:1}),pil:S(0x9e968a,{roughness:1}),bed:S(0xece8e0,{roughness:1}),duvet:S(0xbdb5a8,{roughness:1}),band:S(0x8d857a,{roughness:1}),head:S(0xc3b7a4,{roughness:1}),chair:S(0xcfc8ba,{roughness:1}),
  tv:S(0x0c0c0e,{roughness:.1,metalness:.4,envMapIntensity:1.4}),leaf:S(0x4f7f42,{roughness:.8,flatShading:true}),leaf2:S(0x6c9b50,{roughness:.8,flatShading:true}),pot:S(0xd9d3c9,{roughness:.6}),rug:new THREE.MeshStandardMaterial({map:rugTex(),roughness:1}),
  glass:new THREE.MeshStandardMaterial({color:0xcfe2ea,roughness:.04,transparent:true,opacity:.26,depthWrite:false,envMapIntensity:1.8}),
  led:new THREE.MeshStandardMaterial({color:0xffffff,emissive:0xffcf8e,emissiveIntensity:2.4}),shade:new THREE.MeshStandardMaterial({color:0xf3e8d2,emissive:0xffd9a0,emissiveIntensity:.8,roughness:1})};

// ---------- khối dựng ----------
const H=2.4;
const put=(g,m,x,y,z,o={})=>{const me=new THREE.Mesh(g,m);me.position.set(x,y,z);if(o.ry)me.rotation.y=o.ry;me.castShadow=o.cast!==false&&m!==M.glass;me.receiveShadow=m!==M.glass;(o.parent||sc).add(me);return me};
const rb=(w,h,d,r)=>new RoundedBoxGeometry(w,h,d,3,Math.min(r,w/2-.001,h/2-.001,d/2-.001));
const box=(x0,z0,x1,z1,y0,h,m,o={})=>put(o.r?rb(x1-x0,h,z1-z0,o.r):new THREE.BoxGeometry(x1-x0,h,z1-z0),m,(x0+x1)/2,y0+h/2,(z0+z1)/2,o);
const floor=(x0,z0,x1,z1,m,y=0,tile=1.6)=>{const g=new THREE.PlaneGeometry(x1-x0,z1-z0),uv=g.attributes.uv;for(let i=0;i<uv.count;i++)uv.setXY(i,(x0+uv.getX(i)*(x1-x0))/tile,(z0+(1-uv.getY(i))*(z1-z0))/tile);const f=new THREE.Mesh(g,m);f.rotation.x=-Math.PI/2;f.position.set((x0+x1)/2,y,(z0+z1)/2);f.receiveShadow=true;sc.add(f)};

// Tường chạy theo trục z (a='z') hoặc x, có chừa ô: door, full (cửa kính), win, small, rail (lan can kính)
function wall(a,t0,t1,s0,s1,ops=[]){
  const seg=(p,q,y,h,m,th=0)=>h>0&&q>p&&(a==='z'?box(t0+th,p,t1-th,q,y,h,m):box(p,t0+th,q,t1-th,y,h,m));
  const glz=(p,q,y0,y1,n)=>{const th=(t1-t0)/2-.015,fr=(t1-t0)/2-.03;seg(p,q,y0,y1-y0,M.glass,th);seg(p,q,y0,.04,M.frame,fr);seg(p,q,y1-.04,.04,M.frame,fr);for(let i=0;i<=n;i++){const c=p+(q-p)*i/n;seg(Math.max(p,c-.025),Math.min(q,c+.025),y0,y1-y0,M.frame,fr)}};
  let c=s0;ops.forEach(([p,q,k,n])=>{seg(c,p,0,H,M.wall);
    if(k==='door')seg(p,q,2.15,H-2.15,M.wall);
    if(k==='full'){glz(p,q,0,2.25,n||2);seg(p,q,2.25,H-2.25,M.wall)}
    if(k==='win'){seg(p,q,0,.35,M.wall);glz(p,q,.35,2.2,n||2);seg(p,q,2.2,H-2.2,M.wall)}
    if(k==='small'){seg(p,q,0,1.1,M.wall);glz(p,q,1.1,2.05,1);seg(p,q,2.05,H-2.05,M.wall)}
    if(k==='rail'){seg(p,q,0,.12,M.wall);seg(p,q,.12,1,M.glass,(t1-t0)/2-.015);seg(p,q,1.12,.03,M.frame,(t1-t0)/2-.03)}
    c=q});
  seg(c,s1,0,H,M.wall)}
// cánh cửa mở, bản lề tại (hx,hz)
function leaf(hx,hz,len,ang){const g=new THREE.Group();g.position.set(hx,0,hz);g.rotation.y=ang;sc.add(g);put(rb(len,2.1,.04,.01),M.door,len/2,1.05,0,{parent:g});put(new THREE.CylinderGeometry(.012,.012,.12,8),M.dark,len-.08,1,.04,{parent:g,cast:false}).rotation.z=Math.PI/2}
// dải đèn LED kèm ánh sáng hắt
function led(x0,z0,x1,z1,y,i=1.1){box(x0,z0,x1,z1,y,.012,M.led,{cast:false});const l=new THREE.PointLight(0xffc98a,i,2.6,2);l.position.set((x0+x1)/2,y+.14,(z0+z1)/2);sc.add(l)}

// ---------- sàn, theo layout CH-xx11 (đơn vị mét; x theo cạnh 8,1 m, z theo cạnh 14,3 m) ----------
[[-.02,-.02,6.71,7.62],[-.02,7.6,6.6,11.64],[6.55,9.73,8.12,11.64],[-.02,11.6,6.59,14.31]].forEach(([a,b,c,d])=>box(a,b,c,d,-.28,.27,M.cap,{cast:false}));
floor(.29,1.5,6.45,11.45,M.oak);floor(.29,.24,3.33,1.52,M.oak);floor(.29,11.6,5.25,14.06,M.oak);floor(5.25,11.6,6.3,12.65,M.oak);floor(6.55,9.75,8.1,11.42,M.oak);
floor(3.5,.24,6.44,1.28,M.balc,-.015,.6);floor(.29,4.84,3.33,6.18,M.tile,.003,.6);floor(.29,9.32,2.1,11.43,M.balc,.003,.6);floor(3.62,12.72,6.28,14.06,M.tile,.003,.6);

// ---------- tường ----------
wall('z',0,.29,0,14.29,[[4.97,5.69,'small'],[6.65,8.68,'win',3],[9.32,10.35,'rail']]);   // mặt ngoài phía trước
box(0,10.35,.62,11.8,0,H,M.wall);
wall('x',0,.24,0,3.32,[[.81,2.8,'win',3]]);                                             // cuối phòng ngủ 1
wall('x',0,.08,3.51,6.43,[[3.51,6.43,'rail']]);                                         // lan can ban công
wall('z',3.32,3.51,0,9.32,[[3.82,4.6,'door'],[4.92,5.68,'door'],[6.42,7.2,'door']]);
wall('x',1.27,1.51,3.51,6.43,[[3.65,6.3,'full',3]]);                                    // cửa kính ban công
wall('z',6.43,6.69,0,7.6);                                                              // tường dài phía sau
box(6.6,7.6,8.1,9.75,0,H,M.wall);box(6.43,7.6,6.6,9.75,0,H,M.wall);                     // hộp kỹ thuật
wall('z',7.98,8.1,9.75,11.42,[[10.25,11.2,'door']]);                                    // tường cửa chính
wall('x',4.68,4.85,0,3.32);wall('x',6.17,6.36,0,3.32);wall('x',9.15,9.32,0,3.51);
wall('z',2.08,2.25,9.32,11.42,[[10.05,10.82,'door']]);                                  // cửa ra lô gia
wall('x',11.42,11.62,0,5.31);wall('x',11.42,11.62,6.26,8.1);
wall('z',5.19,5.31,10.83,12.62,[[11.68,12.5,'door']]);                                  // cửa phòng ngủ 3
wall('x',12.62,12.74,3.51,6.57,[[5.36,6.12,'door']]);                                   // cửa WC 2
wall('z',3.51,3.63,12.62,14.05);wall('z',6.26,6.57,11.62,14.29);
wall('x',14.05,14.29,0,6.57,[[3.8,4.7,'small']]);
// mảng ốp đá phòng tắm
[[.29,4.85,3.31,4.87],[.29,6.15,3.31,6.17],[3.29,4.85,3.31,6.17],[3.63,12.74,6.26,12.76],[3.63,14.03,6.26,14.05],[3.63,12.74,3.65,14.05],[6.24,12.74,6.26,14.05]].forEach(([a,b,c,d])=>box(a,b,c,d,.02,2.3,M.clad,{cast:false}));
// cửa đi
leaf(3.36,3.82,.78,Math.PI*.82);leaf(3.36,5.68,.76,Math.PI*.82+Math.PI*.36);leaf(3.36,6.42,.78,-Math.PI*.82);leaf(2.2,10.05,.77,-Math.PI*.32);leaf(5.22,12.5,.82,Math.PI*.82+Math.PI*.36);leaf(5.36,12.74,.76,-Math.PI*.3);
box(7.92,10.25,7.97,11.2,0,2.12,M.door);box(7.86,11.05,7.9,11.1,.95,.04,M.dark,{cast:false});

// ---------- nội thất dùng chung ----------
function bed(cx,cz,ry,w=1.6,l=1.95){const g=new THREE.Group();g.position.set(cx,0,cz);g.rotation.y=ry;sc.add(g);const P=(gm,m,x,y,z)=>put(gm,m,x,y,z,{parent:g});
  P(rb(w+.1,.24,l,.03),M.wood,0,.12,0);P(rb(w,.2,l-.04,.06),M.bed,0,.34,0);P(rb(w+.04,.12,l*.68,.05),M.duvet,0,.46,l*.15);P(rb(w+.05,.05,.48,.02),M.band,0,.51,l*.3);P(rb(w+.22,1.05,.1,.03),M.head,0,.52,-l/2-.04);
  [-.38,.38].forEach(x=>{P(rb(.66,.16,.42,.07),M.bed,x*w/1.6,.52,-l/2+.3);P(rb(.46,.15,.3,.07),M.pil,x*w/1.6,.6,-l/2+.48)})}
function night(x,z){box(x-.22,z-.2,x+.22,z+.2,0,.5,M.wood,{r:.015});put(new THREE.CylinderGeometry(.05,.07,.2,14),M.white,x,.6,z);put(new THREE.CylinderGeometry(.08,.13,.16,18,1,true),M.shade,x,.77,z,{cast:false})}
function ward(x0,z0,x1,z1,h=2.3,n=4){box(x0,z0,x1,z1,.02,h,M.cab,{r:.008});const alongX=x1-x0>z1-z0;for(let i=1;i<n;i++){const t=i/n;alongX?box(x0+(x1-x0)*t,z0-.002,x0+(x1-x0)*t+.005,z1+.002,.06,h-.08,M.dark,{cast:false}):box(x0-.002,z0+(z1-z0)*t,x1+.002,z0+(z1-z0)*t+.005,.06,h-.08,M.dark,{cast:false})}}
function chair(x,z,ry){const g=new THREE.Group();g.position.set(x,0,z);g.rotation.y=ry;sc.add(g);put(rb(.44,.07,.44,.03),M.chair,0,.46,0,{parent:g});put(rb(.44,.42,.06,.03),M.chair,0,.71,-.2,{parent:g});[[-.18,-.18],[.18,-.18],[-.18,.18],[.18,.18]].forEach(([a,b])=>put(new THREE.CylinderGeometry(.014,.012,.44,6),M.frame,a,.22,b,{parent:g,cast:false}))}
